<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 みかちゃんのクリスマスパック 🎄</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 30%, #1a472a 60%, #0d2818 100%);
            font-family: 'Zen Maru Gothic', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 雪のエフェクト */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            color: white;
            font-size: 1rem;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* パック画面 */
        .pack-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .pack-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* タイトル */
        .title {
            color: #ffd700;
            font-size: 2rem;
            font-weight: 900;
            text-shadow: 
                0 0 10px #ffd700,
                0 0 20px #ff6b6b,
                2px 2px 0 #c41e3a;
            margin-bottom: 30px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        /* パック本体 */
        .pack-container {
            position: relative;
            width: 280px;
            height: 400px;
        }

        .pack {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, 
                #c41e3a 0%, 
                #a01830 20%,
                #c41e3a 40%,
                #8b1528 60%,
                #c41e3a 80%,
                #a01830 100%);
            border-radius: 20px;
            position: relative;
            box-shadow: 
                0 10px 40px rgba(0,0,0,0.5),
                inset 0 2px 10px rgba(255,255,255,0.2),
                0 0 30px rgba(196, 30, 58, 0.5);
            overflow: hidden;
            border: 4px solid #ffd700;
        }

        /* パックの装飾 */
        .pack::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 70%);
            pointer-events: none;
        }

        /* リボン */
        .ribbon-vertical {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 100%;
            background: linear-gradient(90deg, #228b22, #32cd32, #228b22);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .ribbon-horizontal {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 50px;
            background: linear-gradient(180deg, #228b22, #32cd32, #228b22);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .ribbon-bow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            z-index: 5;
        }

        .bow-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #ffd700, #ffaa00);
            border-radius: 50%;
            box-shadow: 0 0 15px #ffd700;
        }

        .bow-loop {
            position: absolute;
            width: 40px;
            height: 25px;
            background: linear-gradient(135deg, #228b22, #32cd32);
            border-radius: 50%;
        }

        .bow-loop:nth-child(1) {
            top: 5px;
            left: 0;
            transform: rotate(-30deg);
        }

        .bow-loop:nth-child(2) {
            top: 5px;
            right: 0;
            transform: rotate(30deg);
        }

        .bow-loop:nth-child(3) {
            bottom: 5px;
            left: 10px;
            transform: rotate(-150deg);
        }

        .bow-loop:nth-child(4) {
            bottom: 5px;
            right: 10px;
            transform: rotate(150deg);
        }

        /* パックの装飾（星やハート） */
        .decoration {
            position: absolute;
            font-size: 1.5rem;
            animation: twinkle 1.5s ease-in-out infinite;
        }

        .decoration:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .decoration:nth-child(2) { top: 15%; right: 15%; animation-delay: 0.3s; }
        .decoration:nth-child(3) { bottom: 20%; left: 15%; animation-delay: 0.6s; }
        .decoration:nth-child(4) { bottom: 15%; right: 10%; animation-delay: 0.9s; }

        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* 切り取り線エリア */
        .cut-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, 
                rgba(255,255,255,0.1) 0%,
                transparent 100%);
            border-bottom: 3px dashed #ffd700;
            cursor: pointer;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .cut-instruction {
            color: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            animation: bounce 1s ease-in-out infinite;
            pointer-events: none;
        }

        .cut-arrow {
            color: #ffd700;
            font-size: 1.2rem;
            margin-top: 5px;
            pointer-events: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 切れる演出 */
        .cut-line {
            position: absolute;
            top: 58px;
            left: 0;
            width: 0;
            height: 4px;
            background: linear-gradient(90deg, 
                transparent,
                #fff,
                #ffd700,
                #fff,
                transparent);
            box-shadow: 0 0 20px #ffd700, 0 0 40px #fff;
            transition: width 0.1s linear;
            z-index: 15;
        }

        /* 暗転画面 */
        .blackout-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .blackout-screen.active {
            opacity: 1;
            pointer-events: all;
        }

        /* カウントダウン */
        .countdown {
            color: #ffd700;
            font-size: 8rem;
            font-weight: 900;
            text-shadow: 
                0 0 30px #ffd700,
                0 0 60px #ff6b6b,
                0 0 90px #c41e3a;
            opacity: 0;
            transform: scale(2);
            transition: all 0.5s ease;
        }

        .countdown.show {
            opacity: 1;
            transform: scale(1);
        }

        .countdown.hide {
            opacity: 0;
            transform: scale(0.5);
        }

        /* 結果画面 */
        .result-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #2d1b4e 0%, #1a0f2e 50%, #0d0618 100%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .result-screen.active {
            opacity: 1;
            pointer-events: all;
        }

        /* 紙吹雪エフェクト */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 250;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 結果テキスト */
        .result-badge {
            position: relative;
            padding: 30px 80px;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            border-radius: 20px;
            box-shadow: 
                0 0 50px rgba(255, 215, 0, 0.8),
                0 0 100px rgba(255, 215, 0, 0.4),
                inset 0 2px 10px rgba(255,255,255,0.5);
            animation: resultPulse 2s ease-in-out infinite;
            transform: scale(0);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-badge.show {
            transform: scale(1);
        }

        @keyframes resultPulse {
            0%, 100% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.8), 0 0 100px rgba(255, 215, 0, 0.4); }
            50% { box-shadow: 0 0 80px rgba(255, 215, 0, 1), 0 0 150px rgba(255, 215, 0, 0.6); }
        }

        .result-text {
            font-size: 5rem;
            font-weight: 900;
            color: #c41e3a;
            text-shadow: 
                2px 2px 0 #fff,
                4px 4px 0 rgba(196, 30, 58, 0.3);
        }

        /* ボタン */
        .action-button {
            margin-top: 50px;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Zen Maru Gothic', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #c41e3a, #8b1528);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 8px 30px rgba(196, 30, 58, 0.5),
                0 0 20px rgba(196, 30, 58, 0.3);
            transform: scale(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .action-button.show {
            transform: scale(1);
            animation: buttonFloat 2s ease-in-out infinite;
        }

        .action-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255,255,255,0.3) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        @keyframes buttonFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        .action-button:hover {
            background: linear-gradient(135deg, #d42a4a, #a01830);
            box-shadow: 
                0 12px 40px rgba(196, 30, 58, 0.7),
                0 0 30px rgba(196, 30, 58, 0.5);
        }

        .action-button:active {
            transform: scale(0.95);
        }

        /* 星の装飾（結果画面） */
        .star-decoration {
            position: absolute;
            font-size: 2rem;
            animation: starFloat 3s ease-in-out infinite;
        }

        @keyframes starFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* 光の筋エフェクト */
        .light-rays {
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(255,215,0,0.1) 10deg,
                transparent 20deg,
                transparent 30deg,
                rgba(255,215,0,0.1) 40deg,
                transparent 50deg,
                transparent 60deg,
                rgba(255,215,0,0.1) 70deg,
                transparent 80deg,
                transparent 90deg
            );
            animation: raysSpin 20s linear infinite;
            pointer-events: none;
        }

        @keyframes raysSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 雪のエフェクト -->
    <div class="snowflakes" id="snowflakes"></div>

    <!-- パック画面 -->
    <div class="pack-screen" id="packScreen">
        <h1 class="title">🎄 クリスマスパック 🎄</h1>
        
        <div class="pack-container">
            <div class="pack">
                <!-- 装飾 -->
                <span class="decoration">⭐</span>
                <span class="decoration">❤️</span>
                <span class="decoration">🎄</span>
                <span class="decoration">✨</span>
                
                <!-- リボン -->
                <div class="ribbon-vertical"></div>
                <div class="ribbon-horizontal"></div>
                <div class="ribbon-bow">
                    <div class="bow-loop"></div>
                    <div class="bow-loop"></div>
                    <div class="bow-loop"></div>
                    <div class="bow-loop"></div>
                    <div class="bow-center"></div>
                </div>
                
                <!-- 切り取りエリア -->
                <div class="cut-area" id="cutArea">
                    <span class="cut-instruction">👉 横になぞったら切れるよ！ 👈</span>
                    <span class="cut-arrow">→→→→→→→→→→</span>
                </div>
                
                <!-- 切れる線 -->
                <div class="cut-line" id="cutLine"></div>
            </div>
        </div>
    </div>

    <!-- 暗転画面 -->
    <div class="blackout-screen" id="blackoutScreen">
        <div class="countdown" id="countdown"></div>
    </div>

    <!-- 結果画面 -->
    <div class="result-screen" id="resultScreen">
        <div class="light-rays"></div>
        <div class="confetti-container" id="confettiContainer"></div>
        
        <div class="result-badge" id="resultBadge">
            <span class="result-text">２等</span>
        </div>
        
        <button class="action-button" id="actionButton">
            ここを押してね♡
        </button>
    </div>

    <script>
        // 雪を生成
        function createSnowflakes() {
            const container = document.getElementById('snowflakes');
            const snowflakeChars = ['❄', '❅', '❆', '✧', '✦'];
            
            for (let i = 0; i < 50; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                snowflake.style.fontSize = (Math.random() * 1 + 0.5) + 'rem';
                container.appendChild(snowflake);
            }
        }
        createSnowflakes();

        // 切り取り機能
        const cutArea = document.getElementById('cutArea');
        const cutLine = document.getElementById('cutLine');
        const packScreen = document.getElementById('packScreen');
        const blackoutScreen = document.getElementById('blackoutScreen');
        const countdown = document.getElementById('countdown');
        const resultScreen = document.getElementById('resultScreen');
        const resultBadge = document.getElementById('resultBadge');
        const actionButton = document.getElementById('actionButton');

        let isDragging = false;
        let startX = 0;
        let cutProgress = 0;
        let isCut = false;

        function handleStart(e) {
            if (isCut) return;
            isDragging = true;
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            startX = clientX;
            cutProgress = 0;
        }

        function handleMove(e) {
            if (!isDragging || isCut) return;
            
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const deltaX = clientX - startX;
            
            // 右方向へのドラッグのみ
            if (deltaX > 0) {
                cutProgress = Math.min(deltaX / 200, 1);
                cutLine.style.width = (cutProgress * 100) + '%';
                
                // 切り取り完了
                if (cutProgress >= 1) {
                    completeCut();
                }
            }
        }

        function handleEnd() {
            if (isCut) return;
            isDragging = false;
            
            // 途中で離した場合はリセット
            if (cutProgress < 1) {
                cutLine.style.width = '0';
                cutProgress = 0;
            }
        }

        function completeCut() {
            isCut = true;
            isDragging = false;
            
            // 切れる効果音的な演出（画面を一瞬震わせる）
            document.body.style.animation = 'none';
            document.body.offsetHeight; // リフロー
            
            // 少し遅延してから暗転
            setTimeout(() => {
                packScreen.classList.add('hidden');
                blackoutScreen.classList.add('active');
                
                // カウントダウン開始
                startCountdown();
            }, 500);
        }

        // イベントリスナー
        cutArea.addEventListener('mousedown', handleStart);
        cutArea.addEventListener('touchstart', handleStart);
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('touchmove', handleMove);
        document.addEventListener('mouseup', handleEnd);
        document.addEventListener('touchend', handleEnd);

        // カウントダウン
        function startCountdown() {
            const numbers = ['５', '４', '３', '２', '１', '０'];
            let index = 0;
            
            function showNumber() {
                if (index < numbers.length) {
                    countdown.textContent = numbers[index];
                    countdown.classList.remove('hide');
                    countdown.classList.add('show');
                    
                    setTimeout(() => {
                        countdown.classList.remove('show');
                        countdown.classList.add('hide');
                        
                        setTimeout(() => {
                            index++;
                            if (index < numbers.length) {
                                showNumber();
                            } else {
                                // カウントダウン終了
                                setTimeout(() => {
                                    showResult();
                                }, 500);
                            }
                        }, 300);
                    }, 700);
                }
            }
            
            setTimeout(showNumber, 500);
        }

        // 結果表示
        function showResult() {
            blackoutScreen.classList.remove('active');
            resultScreen.classList.add('active');
            
            // 紙吹雪を生成
            createConfetti();
            
            // 結果バッジ表示
            setTimeout(() => {
                resultBadge.classList.add('show');
            }, 300);
            
            // ボタン表示
            setTimeout(() => {
                actionButton.classList.add('show');
            }, 1000);
        }

        // 紙吹雪
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#ffd700', '#c41e3a', '#228b22', '#ff69b4', '#00bfff', '#ff6347'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                }
                
                container.appendChild(confetti);
            }
        }

        // ボタンクリック
        actionButton.addEventListener('click', () => {
            alert('🎄 メリークリスマス！ 🎄\n\nおめでとうございます！２等です！');
        });
    </script>
</body>
</html>
