<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 クリスマスパック 🎄</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
        }

        /* 雪のエフェクト */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            color: white;
            font-size: 1rem;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        /* シーン1: パック表示 */
        #scene-pack {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .pack-container {
            position: relative;
            cursor: pointer;
        }

        .pack {
            width: 280px;
            height: 380px;
            background: linear-gradient(135deg, #ff6b6b 0%, #c0392b 50%, #96281b 100%);
            border-radius: 20px;
            position: relative;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 2px 10px rgba(255, 255, 255, 0.3);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .pack:hover {
            transform: scale(1.02);
        }

        .pack::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 100%;
            background: linear-gradient(180deg, #ffd700 0%, #ffb347 100%);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .pack::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 60px;
            background: linear-gradient(90deg, #ffd700 0%, #ffb347 100%);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .ribbon-bow {
            position: absolute;
            top: calc(50% - 50px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }

        .ribbon-bow::before,
        .ribbon-bow::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 40px;
            background: #ffd700;
            border-radius: 50%;
        }

        .ribbon-bow::before {
            left: -55px;
            top: 10px;
            transform: rotate(-30deg);
        }

        .ribbon-bow::after {
            right: -55px;
            top: 10px;
            transform: rotate(30deg);
        }

        .ribbon-center {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ffed4a;
            border-radius: 50%;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px rgba(255, 237, 74, 0.8);
        }

        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* 切り取り線エリア */
        .cut-area {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            height: 50px;
            z-index: 20;
            cursor: grab;
        }

        .cut-area:active {
            cursor: grabbing;
        }

        .cut-line {
            position: absolute;
            top: 35px;
            left: 0;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                white 0px,
                white 10px,
                transparent 10px,
                transparent 20px
            );
            z-index: 10;
        }

        .cut-instruction {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.85rem;
            color: #c0392b;
            white-space: nowrap;
            z-index: 21;
            font-weight: 700;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
        }

        /* スライドガイド矢印 */
        .slide-guide {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 22;
            animation: slideHint 1.5s ease-in-out infinite;
        }

        .slide-guide .arrow {
            font-size: 1.5rem;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .slide-guide .hand {
            font-size: 2rem;
            animation: handMove 1.5s ease-in-out infinite;
        }

        @keyframes slideHint {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes handMove {
            0%, 100% { transform: translateX(-30px); }
            50% { transform: translateX(30px); }
        }

        /* スライド進捗バー */
        .slide-progress {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
            z-index: 22;
        }

        .slide-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff6b6b);
            border-radius: 4px;
            transition: width 0.1s;
        }

        .pack-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 37px;
            background: linear-gradient(135deg, #ff6b6b 0%, #c0392b 100%);
            border-radius: 20px 20px 0 0;
            z-index: 9;
        }

        .pack.cutting .pack-top {
            animation: cutTop 0.5s ease-out forwards;
        }

        @keyframes cutTop {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(-20deg); opacity: 0; }
        }

        .title {
            color: #ffd700;
            font-size: 2rem;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            margin-bottom: 30px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
            50% { text-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 0 60px rgba(255, 215, 0, 0.5); }
        }

        /* 暗転 */
        #blackout {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .countdown {
            font-size: 8rem;
            color: white;
            text-shadow: 0 0 50px rgba(255, 255, 255, 0.8);
            animation: countPulse 1s ease-in-out;
        }

        @keyframes countPulse {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* シーン2: 2等演出 */
        #scene-button {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
            z-index: 50;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 2等ボタン（銀色に光り輝く） */
        .second-prize-btn {
            width: 220px;
            height: 220px;
            background: linear-gradient(145deg, #f0f0f0, #c0c0c0, #a8a8a8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            color: #333;
            font-weight: 900;
            box-shadow: 
                0 0 60px rgba(192, 192, 192, 0.8),
                0 0 120px rgba(192, 192, 192, 0.4),
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 5px 30px rgba(255, 255, 255, 0.8);
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
            transform: scale(0);
            animation: silverShine 2s ease-in-out infinite;
        }

        .second-prize-btn.show {
            animation: prizeAppear 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards, silverShine 2s ease-in-out infinite 1s;
        }

        @keyframes prizeAppear {
            0% { transform: scale(0) rotate(-180deg); }
            60% { transform: scale(1.2) rotate(10deg); }
            80% { transform: scale(0.9) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes silverShine {
            0%, 100% { 
                box-shadow: 
                    0 0 60px rgba(192, 192, 192, 0.8),
                    0 0 120px rgba(192, 192, 192, 0.4),
                    0 10px 40px rgba(0, 0, 0, 0.5),
                    inset 0 5px 30px rgba(255, 255, 255, 0.8);
            }
            50% { 
                box-shadow: 
                    0 0 100px rgba(255, 255, 255, 1),
                    0 0 200px rgba(192, 192, 192, 0.8),
                    0 10px 40px rgba(0, 0, 0, 0.5),
                    inset 0 5px 30px rgba(255, 255, 255, 1);
            }
        }

        .second-prize-btn:active {
            transform: scale(0.95);
        }

        .crack-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            pointer-events: none;
            overflow: hidden;
        }

        .crack {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
        }

        /* おや...テキスト */
        .oya-text {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.5rem;
            color: #fff;
            opacity: 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }

        .oya-text.show {
            animation: oyaAppear 1.5s ease-out forwards;
        }

        @keyframes oyaAppear {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        /* サンタクロース */
        .santa-container {
            position: absolute;
            bottom: 100px;
            left: -200px;
            transition: left 3s ease-out;
        }

        .santa-container.walking {
            left: calc(50% + 140px);
        }

        .santa {
            position: relative;
            width: 120px;
            height: 180px;
        }

        .santa-head {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            background: #ffe4c4;
            border-radius: 50%;
        }

        .santa-hat {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 60px solid #e74c3c;
        }

        .santa-hat::after {
            content: '';
            position: absolute;
            top: 55px;
            left: -50px;
            width: 100px;
            height: 15px;
            background: white;
            border-radius: 8px;
        }

        .santa-hat-ball {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 25px;
            background: white;
            border-radius: 50%;
        }

        .santa-eye {
            position: absolute;
            width: 10px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            top: 25px;
        }

        .santa-eye.left { left: 18px; }
        .santa-eye.right { right: 18px; }

        .santa-cheek {
            position: absolute;
            width: 15px;
            height: 10px;
            background: #ffb6c1;
            border-radius: 50%;
            top: 40px;
        }

        .santa-cheek.left { left: 5px; }
        .santa-cheek.right { right: 5px; }

        .santa-nose {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #e74c3c;
            border-radius: 50%;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
        }

        .santa-beard {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 50px;
            background: white;
            border-radius: 0 0 30px 30px;
        }

        .santa-mustache {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 15px;
            background: white;
            border-radius: 0 0 25px 25px;
        }

        .santa-body {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: #e74c3c;
            border-radius: 20px 20px 0 0;
        }

        .santa-belt {
            position: absolute;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 15px;
            background: #222;
        }

        .santa-belt::after {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 3px;
        }

        .santa-leg {
            position: absolute;
            top: 140px;
            width: 25px;
            height: 35px;
            background: #e74c3c;
        }

        .santa-leg.left { left: 25px; }
        .santa-leg.right { right: 25px; }

        .santa-boot {
            position: absolute;
            top: 165px;
            width: 35px;
            height: 20px;
            background: #222;
            border-radius: 10px;
        }

        .santa-boot.left { left: 18px; }
        .santa-boot.right { right: 18px; }

        .santa.walking {
            animation: santaWalk 0.5s ease-in-out infinite;
        }

        @keyframes santaWalk {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }

        /* 吹き出し */
        .speech-bubble {
            position: absolute;
            left: -220px;
            top: -30px;
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 1rem;
            color: #333;
            font-weight: 700;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: scale(0);
            white-space: nowrap;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            border: 10px solid transparent;
            border-left-color: white;
        }

        .speech-bubble.show {
            animation: bubblePop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes bubblePop {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        .tap-count {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 1.8rem;
            opacity: 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .tap-count.visible {
            opacity: 1;
        }

        /* 1等ボタン（金色に光り輝く） */
        #first-prize-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, rgba(0,0,0,0.9) 100%);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .first-prize-btn {
            width: 280px;
            height: 280px;
            background: linear-gradient(145deg, #ffd700, #ffb347, #ff8c00);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            color: white;
            font-weight: 900;
            box-shadow: 
                0 0 80px rgba(255, 215, 0, 1),
                0 0 150px rgba(255, 215, 0, 0.8),
                0 0 250px rgba(255, 215, 0, 0.5),
                0 15px 50px rgba(0, 0, 0, 0.5),
                inset 0 5px 30px rgba(255, 255, 255, 0.5);
            transform: scale(0);
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
            animation: goldShine 1.5s ease-in-out infinite;
            line-height: 1.2;
        }

        .first-prize-btn .sub-text {
            font-size: 1.5rem;
            margin-top: 5px;
        }

        .first-prize-btn.show {
            animation: firstPrizePop 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards, goldShine 1.5s ease-in-out infinite 0.8s;
        }

        @keyframes firstPrizePop {
            0% { transform: scale(0) rotate(-180deg); }
            60% { transform: scale(1.4) rotate(15deg); }
            80% { transform: scale(0.9) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes goldShine {
            0%, 100% { 
                box-shadow: 
                    0 0 80px rgba(255, 215, 0, 1),
                    0 0 150px rgba(255, 215, 0, 0.8),
                    0 0 250px rgba(255, 215, 0, 0.5),
                    0 15px 50px rgba(0, 0, 0, 0.5),
                    inset 0 5px 30px rgba(255, 255, 255, 0.5);
            }
            50% { 
                box-shadow: 
                    0 0 120px rgba(255, 255, 255, 1),
                    0 0 200px rgba(255, 215, 0, 1),
                    0 0 350px rgba(255, 215, 0, 0.8),
                    0 15px 50px rgba(0, 0, 0, 0.5),
                    inset 0 5px 50px rgba(255, 255, 255, 0.8);
            }
        }

        .final-btn {
            padding: 20px 40px;
            font-size: 1.5rem;
            background: linear-gradient(145deg, #ff69b4, #ff1493);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.5);
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 700;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 40px;
            opacity: 0;
        }

        .final-btn.show {
            animation: fadeInUp 0.8s ease-out 0.5s forwards;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .final-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.7);
        }

        /* 紙吹雪 */
        .confetti {
            position: absolute;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* 光のバースト */
        .light-burst {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255,215,0,1) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 199;
        }

        .light-burst.show {
            animation: burst 0.8s ease-out forwards;
        }

        @keyframes burst {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 200vw; height: 200vw; opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- 雪 -->
    <div class="snowflakes" id="snowflakes"></div>

    <!-- シーン1: パック -->
    <div id="scene-pack">
        <h1 class="title">🎄 クリスマスパック 🎄</h1>
        <div class="pack-container">
            <div class="pack" id="pack">
                <div class="pack-top"></div>
                <div class="cut-line"></div>
                <div class="cut-area" id="cut-area">
                    <div class="cut-instruction">👆 横になぞったら切れるよ！</div>
                    <div class="slide-guide">
                        <span class="arrow">◀</span>
                        <span class="hand">👆</span>
                        <span class="arrow">▶</span>
                    </div>
                </div>
                <div class="slide-progress">
                    <div class="slide-progress-bar" id="slide-progress-bar"></div>
                </div>
                <div class="ribbon-bow">
                    <div class="ribbon-center"></div>
                </div>
                <div class="sparkle" style="top: 25%; left: 20%; animation-delay: 0s;"></div>
                <div class="sparkle" style="top: 35%; right: 15%; animation-delay: 0.5s;"></div>
                <div class="sparkle" style="bottom: 25%; left: 25%; animation-delay: 1s;"></div>
                <div class="sparkle" style="bottom: 35%; right: 20%; animation-delay: 1.5s;"></div>
            </div>
        </div>
    </div>

    <!-- 暗転・カウントダウン -->
    <div id="blackout">
        <div class="countdown" id="countdown"></div>
    </div>

    <!-- シーン2: 2等演出 -->
    <div id="scene-button">
        <div class="oya-text" id="oya-text">おや…？</div>
        <div class="tap-count" id="tap-count"></div>

        <div class="second-prize-btn" id="second-prize-btn">
            ２等！！！
            <div class="crack-overlay" id="crack-overlay"></div>
        </div>

        <!-- サンタクロース -->
        <div class="santa-container" id="santa-container">
            <div class="speech-bubble" id="speech-bubble">
                🎅 ２等のボタンを<br>連打するのじゃ！
            </div>
            <div class="santa" id="santa">
                <div class="santa-head">
                    <div class="santa-hat">
                        <div class="santa-hat-ball"></div>
                    </div>
                    <div class="santa-eye left"></div>
                    <div class="santa-eye right"></div>
                    <div class="santa-cheek left"></div>
                    <div class="santa-cheek right"></div>
                    <div class="santa-nose"></div>
                    <div class="santa-mustache"></div>
                    <div class="santa-beard"></div>
                </div>
                <div class="santa-body"></div>
                <div class="santa-belt"></div>
                <div class="santa-leg left"></div>
                <div class="santa-leg right"></div>
                <div class="santa-boot left"></div>
                <div class="santa-boot right"></div>
            </div>
        </div>
    </div>

    <!-- 1等フィナーレ -->
    <div id="first-prize-overlay">
        <div class="first-prize-btn" id="first-prize-btn">
            １等！！
            <span class="sub-text">おめでとう♡</span>
        </div>
        <button class="final-btn" id="final-btn">ここを押してね♡</button>
    </div>

    <!-- 光のバースト -->
    <div class="light-burst" id="light-burst"></div>

    <script>
        // 雪を生成
        function createSnowflakes() {
            const container = document.getElementById('snowflakes');
            const snowflakeChars = ['❄', '❅', '❆', '✻', '✼'];
            
            for (let i = 0; i < 50; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                snowflake.style.fontSize = (Math.random() * 1 + 0.5) + 'rem';
                container.appendChild(snowflake);
            }
        }
        createSnowflakes();

        // スライド検出（より分かりやすく）
        let startX = 0;
        let isDragging = false;
        let totalDistance = 0;
        const requiredDistance = 150;
        let hasSwiped = false;
        
        const cutArea = document.getElementById('cut-area');
        const pack = document.getElementById('pack');
        const progressBar = document.getElementById('slide-progress-bar');

        cutArea.addEventListener('mousedown', startDrag);
        cutArea.addEventListener('touchstart', startDrag);
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('touchmove', onDrag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        function startDrag(e) {
            if (hasSwiped) return;
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            totalDistance = 0;
        }

        function onDrag(e) {
            if (!isDragging || hasSwiped) return;
            
            const currentX = e.clientX || (e.touches && e.touches[0].clientX);
            if (!currentX) return;
            
            const distance = Math.abs(currentX - startX);
            totalDistance = Math.max(totalDistance, distance);
            
            // 進捗バーを更新
            const progress = Math.min((totalDistance / requiredDistance) * 100, 100);
            progressBar.style.width = progress + '%';
            
            if (totalDistance >= requiredDistance) {
                cutPack();
            }
        }

        function endDrag() {
            isDragging = false;
            if (!hasSwiped) {
                progressBar.style.width = '0%';
            }
        }

        function cutPack() {
            hasSwiped = true;
            isDragging = false;
            progressBar.style.width = '100%';
            pack.classList.add('cutting');
            
            setTimeout(() => {
                document.getElementById('scene-pack').style.display = 'none';
                startBlackout();
            }, 600);
        }

        // 暗転とカウントダウン
        function startBlackout() {
            const blackout = document.getElementById('blackout');
            const countdown = document.getElementById('countdown');
            blackout.style.display = 'flex';
            
            let count = 5;
            
            function showCount() {
                countdown.textContent = count;
                countdown.style.animation = 'none';
                countdown.offsetHeight;
                countdown.style.animation = 'countPulse 1s ease-in-out';
                
                if (count > 0) {
                    count--;
                    setTimeout(showCount, 1000);
                } else {
                    setTimeout(() => {
                        blackout.style.display = 'none';
                        showPrizeScene();
                    }, 1000);
                }
            }
            
            setTimeout(showCount, 500);
        }

        // シーン2
        let tapCount = 0;
        const maxTaps = 20;
        let canTap = false;

        function showPrizeScene() {
            const scene = document.getElementById('scene-button');
            const btn = document.getElementById('second-prize-btn');
            
            scene.style.display = 'flex';
            
            // 2等ボタンが銀色に光り輝いて出現
            setTimeout(() => {
                btn.classList.add('show');
                
                // しばらくして「おや...？」
                setTimeout(() => {
                    const oyaText = document.getElementById('oya-text');
                    oyaText.classList.add('show');
                    
                    // サンタがてくてく歩いてくる
                    setTimeout(() => {
                        const santaContainer = document.getElementById('santa-container');
                        const santa = document.getElementById('santa');
                        
                        santa.classList.add('walking');
                        santaContainer.classList.add('walking');
                        
                        // 歩き終わったらボタンの横に止まる
                        setTimeout(() => {
                            santa.classList.remove('walking');
                            
                            // 吹き出しを出す
                            setTimeout(() => {
                                oyaText.style.transition = 'opacity 0.5s';
                                oyaText.style.opacity = '0';
                                
                                document.getElementById('speech-bubble').classList.add('show');
                                document.getElementById('tap-count').classList.add('visible');
                                updateTapCount();
                                canTap = true;
                            }, 500);
                        }, 3000);
                    }, 1500);
                }, 2500);
            }, 500);
        }

        function updateTapCount() {
            document.getElementById('tap-count').textContent = `${tapCount} / ${maxTaps}`;
        }

        // 2等ボタンをタップ
        const secondPrizeBtn = document.getElementById('second-prize-btn');
        secondPrizeBtn.addEventListener('click', handleTap);
        secondPrizeBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap();
        });

        function handleTap() {
            if (!canTap || tapCount >= maxTaps) return;
            
            tapCount++;
            updateTapCount();
            
            // ヒビを追加
            addCrack();
            
            // ボタンを揺らす
            const btn = document.getElementById('second-prize-btn');
            btn.style.transform = `translate(${Math.random() * 10 - 5}px, ${Math.random() * 10 - 5}px) scale(1)`;
            setTimeout(() => {
                btn.style.transform = 'translate(0, 0) scale(1)';
            }, 80);
            
            if (tapCount >= maxTaps) {
                canTap = false;
                setTimeout(showFirstPrize, 300);
            }
        }

        function addCrack() {
            const overlay = document.getElementById('crack-overlay');
            
            // 複数のヒビを追加
            for (let i = 0; i < 2; i++) {
                const crack = document.createElement('div');
                crack.className = 'crack';
                
                const angle = Math.random() * 360;
                const length = 40 + Math.random() * 80;
                const width = 2 + Math.random() * 4;
                const centerX = 110;
                const centerY = 110;
                const offsetX = (Math.random() - 0.5) * 120;
                const offsetY = (Math.random() - 0.5) * 120;
                
                crack.style.cssText = `
                    left: ${centerX + offsetX}px;
                    top: ${centerY + offsetY}px;
                    width: ${length}px;
                    height: ${width}px;
                    transform: rotate(${angle}deg);
                    background: linear-gradient(90deg, transparent, rgba(30,30,30,0.9), transparent);
                `;
                
                overlay.appendChild(crack);
            }
        }

        function showFirstPrize() {
            // 光のバースト
            document.getElementById('light-burst').classList.add('show');
            
            // 少し遅れて1等画面表示
            setTimeout(() => {
                document.getElementById('scene-button').style.display = 'none';
                const overlay = document.getElementById('first-prize-overlay');
                overlay.style.display = 'flex';
                
                // 1等ボタンを勢いよく出現
                setTimeout(() => {
                    document.getElementById('first-prize-btn').classList.add('show');
                    document.getElementById('final-btn').classList.add('show');
                    createConfetti();
                }, 200);
            }, 400);
        }

        function createConfetti() {
            const colors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3', '#ff69b4', '#ffd700', '#ffffff'];
            const overlay = document.getElementById('first-prize-overlay');
            
            for (let i = 0; i < 200; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.cssText = `
                    left: ${Math.random() * 100}%;
                    top: -20px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    width: ${5 + Math.random() * 15}px;
                    height: ${5 + Math.random() * 15}px;
                    border-radius: ${Math.random() > 0.5 ? '50%' : '0'};
                    animation-delay: ${Math.random() * 3}s;
                    animation-duration: ${2 + Math.random() * 3}s;
                `;
                overlay.appendChild(confetti);
            }
        }

        // 最終ボタン
        document.getElementById('final-btn').addEventListener('click', () => {
            alert('🎄 メリークリスマス！ 🎄\n\n１等おめでとうございます！\n素敵なクリスマスをお過ごしください♡');
        });
    </script>
</body>
</html>
