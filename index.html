<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みかちゃんのクリスマスガチャ🎄</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #FFE4EC;
            --pink-main: #FF9EB5;
            --pink-dark: #FF6B8A;
            --yellow-light: #FFF8DC;
            --yellow-main: #FFD93D;
            --mint: #98E4D0;
            --white: #FFFFFF;
            --cream: #FFF5E6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #FFE4EC 0%, #FFF5E6 50%, #E8F5E9 100%);
            overflow-x: hidden;
        }

        /* 雪のアニメーション */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            top: -20px;
            color: white;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--pink-dark);
            text-shadow: 2px 2px 0 var(--white), 4px 4px 0 rgba(255, 107, 138, 0.3);
            margin: 20px 0;
            text-align: center;
        }

        .title span {
            display: inline-block;
            animation: bounce 0.6s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        /* ガチャマシン */
        .gacha-machine {
            position: relative;
            width: 280px;
            height: 400px;
            margin: 20px auto;
        }

        .gacha-top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 60px;
            background: linear-gradient(180deg, #FF9EB5 0%, #FF6B8A 100%);
            border-radius: 100px 100px 0 0;
            border: 4px solid var(--pink-dark);
            border-bottom: none;
        }

        .gacha-top::before {
            content: '🎄';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
        }

        .gacha-globe {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 180px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.4) 100%);
            border-radius: 50%;
            border: 6px solid var(--pink-main);
            overflow: hidden;
            box-shadow: inset 0 -20px 40px rgba(255, 158, 181, 0.3);
        }

        .gacha-balls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            padding: 10px;
            gap: 5px;
        }

        .mini-ball {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            animation: wiggle 2s ease-in-out infinite;
        }

        .mini-ball:nth-child(1) { background: linear-gradient(135deg, #FF6B8A 50%, #FF4D6D 50%); animation-delay: 0s; }
        .mini-ball:nth-child(2) { background: linear-gradient(135deg, #FFD93D 50%, #FFC107 50%); animation-delay: 0.2s; }
        .mini-ball:nth-child(3) { background: linear-gradient(135deg, #98E4D0 50%, #4ECDC4 50%); animation-delay: 0.4s; }
        .mini-ball:nth-child(4) { background: linear-gradient(135deg, #A78BFA 50%, #8B5CF6 50%); animation-delay: 0.1s; }
        .mini-ball:nth-child(5) { background: linear-gradient(135deg, #FF9EB5 50%, #FF6B8A 50%); animation-delay: 0.3s; }
        .mini-ball:nth-child(6) { background: linear-gradient(135deg, #87CEEB 50%, #5DADE2 50%); animation-delay: 0.5s; }
        .mini-ball:nth-child(7) { background: linear-gradient(135deg, #FFD93D 50%, #FFC107 50%); animation-delay: 0.15s; }
        .mini-ball:nth-child(8) { background: linear-gradient(135deg, #FF6B8A 50%, #FF4D6D 50%); animation-delay: 0.35s; }

        @keyframes wiggle {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-3px) rotate(-5deg); }
            75% { transform: translateX(3px) rotate(5deg); }
        }

        .gacha-body {
            position: absolute;
            top: 230px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 130px;
            background: linear-gradient(180deg, var(--pink-main) 0%, var(--pink-dark) 100%);
            border-radius: 0 0 30px 30px;
            border: 4px solid var(--pink-dark);
            border-top: none;
        }

        .gacha-handle {
            position: absolute;
            right: -40px;
            top: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--yellow-main) 0%, #FFA500 100%);
            border-radius: 50%;
            border: 4px solid #E6A100;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
        }

        .gacha-handle::after {
            content: '⭐';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
        }

        .gacha-dispenser {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 50px;
            background: linear-gradient(180deg, #333 0%, #1a1a1a 100%);
            border-radius: 0 0 20px 20px;
        }

        .gacha-dispenser::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: #444;
            border-radius: 0 0 10px 10px;
        }

        .gacha-feet {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 20px;
            background: linear-gradient(180deg, var(--pink-dark) 0%, #E5556A 100%);
            border-radius: 10px;
        }

        /* 1回回すボタン */
        .spin-button {
            margin-top: 30px;
            padding: 18px 50px;
            font-size: 1.5rem;
            font-weight: 800;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            color: white;
            background: linear-gradient(180deg, var(--pink-main) 0%, var(--pink-dark) 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #D44D6A, 0 8px 20px rgba(255, 107, 138, 0.4);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .spin-button::before {
            content: '🎁';
            margin-right: 10px;
        }

        .spin-button::after {
            content: '✨';
            margin-left: 10px;
        }

        .spin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #D44D6A, 0 12px 25px rgba(255, 107, 138, 0.5);
        }

        .spin-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #D44D6A, 0 4px 10px rgba(255, 107, 138, 0.3);
        }

        /* 確認モーダル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(180deg, var(--white) 0%, var(--cream) 100%);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 4px solid var(--pink-main);
        }

        @keyframes modalPop {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--pink-dark);
            margin-bottom: 10px;
        }

        .modal-warning {
            font-size: 1rem;
            font-weight: 700;
            color: #FF4D6D;
            margin-bottom: 25px;
        }

        .modal-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .modal-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn.yes {
            background: linear-gradient(180deg, var(--yellow-main) 0%, #FFA500 100%);
            color: #8B4513;
            box-shadow: 0 4px 0 #CC8400;
        }

        .modal-btn.yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #CC8400;
        }

        .modal-btn.no {
            background: linear-gradient(180deg, #E0E0E0 0%, #BDBDBD 100%);
            color: #666;
            box-shadow: 0 4px 0 #999;
        }

        .modal-btn.no:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #999;
        }

        /* カプセル演出 */
        .capsule-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #FFE4EC 0%, #FFB6C1 50%, #FF9EB5 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            flex-direction: column;
        }

        .capsule-screen.active {
            display: flex;
        }

        .capsule {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .capsule-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 100px;
            background: linear-gradient(180deg, #FFD93D 0%, #FFA500 100%);
            border-radius: 100px 100px 0 0;
            border: 4px solid #E6A100;
            transform-origin: center bottom;
            z-index: 2;
        }

        .capsule-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200px;
            height: 100px;
            background: linear-gradient(180deg, #FFFFFF 0%, #F0F0F0 100%);
            border-radius: 0 0 100px 100px;
            border: 4px solid #DDD;
            border-top: none;
        }

        .capsule-shine {
            position: absolute;
            top: 20px;
            left: 30px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
        }

        .capsule.drop {
            animation: capsuleDrop 1.8s ease-out forwards;
        }

        @keyframes capsuleDrop {
            0% {
                transform: translateY(-400px) rotate(-15deg);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            70% {
                transform: translateY(30px) rotate(5deg);
            }
            85% {
                transform: translateY(-15px) rotate(-3deg);
            }
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
        }

        .capsule.shake {
            animation: capsuleShake 0.4s ease-in-out 5;
        }

        @keyframes capsuleShake {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            20% { transform: rotate(-12deg) translateX(-5px); }
            40% { transform: rotate(10deg) translateX(5px); }
            60% { transform: rotate(-8deg) translateX(-3px); }
            80% { transform: rotate(6deg) translateX(3px); }
        }

        .capsule-top.open {
            animation: capsuleOpen 1s ease-out forwards;
        }

        @keyframes capsuleOpen {
            0% {
                transform: rotate(0deg) translateY(0);
            }
            30% {
                transform: rotate(-30deg) translateY(-10px);
            }
            100% {
                transform: rotate(-140deg) translateY(-60px);
            }
        }

        .capsule.glow {
            filter: drop-shadow(0 0 30px rgba(255, 217, 61, 0.8)) drop-shadow(0 0 60px rgba(255, 255, 255, 0.6));
        }

        .capsule.glow::before {
            content: '✨';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            animation: sparkleGlow 0.5s ease-in-out infinite alternate;
        }

        @keyframes sparkleGlow {
            from { opacity: 0.5; transform: translateX(-50%) scale(1); }
            to { opacity: 1; transform: translateX(-50%) scale(1.3); }
        }

        /* 光り輝く画像演出 */
        .reveal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #FFF8DC 0%, #FFD93D 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
            flex-direction: column;
        }

        .reveal-screen.active {
            display: flex;
        }

        .light-burst {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .light-ray {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 200%;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.8), transparent);
            transform-origin: center center;
            animation: rayRotate 3s linear infinite;
        }

        @keyframes rayRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            font-size: 2rem;
            animation: sparkleFloat 2s ease-in-out infinite;
        }

        @keyframes sparkleFloat {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.5) rotate(180deg); opacity: 0.5; }
        }

        .reveal-image {
            width: 280px;
            height: auto;
            max-height: 60vh;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(255, 217, 61, 0.8), 0 0 100px rgba(255, 255, 255, 0.5);
            animation: imageReveal 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            z-index: 10;
        }

        @keyframes imageReveal {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .rank-text {
            position: absolute;
            top: 8%;
            font-size: 4rem;
            font-weight: 800;
            color: var(--pink-dark);
            text-shadow: 3px 3px 0 var(--white), 6px 6px 0 rgba(255, 107, 138, 0.3);
            animation: rankPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            animation-delay: 0.5s;
            opacity: 0;
            z-index: 20;
            text-align: center;
        }

        .prize-name {
            position: absolute;
            top: 18%;
            font-size: 1.5rem;
            font-weight: 700;
            color: #FF69B4;
            text-shadow: 2px 2px 0 var(--white);
            opacity: 0;
            z-index: 20;
            animation: prizeNamePop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            animation-delay: 1s;
        }

        @keyframes prizeNamePop {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes rankPop {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 結果画面 */
        .result-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #FFE4EC 0%, #FFF5E6 50%, #E8F5E9 100%);
            display: none;
            justify-content: flex-start;
            align-items: center;
            z-index: 400;
            flex-direction: column;
            padding: 30px 20px;
            overflow-y: auto;
        }

        .result-screen.active {
            display: flex;
        }

        .result-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--pink-dark);
            text-shadow: 2px 2px 0 var(--white);
            margin-bottom: 20px;
        }

        .result-rank {
            font-size: 3rem;
            font-weight: 800;
            color: #8B4513;
            background: linear-gradient(180deg, var(--yellow-main) 0%, #FFA500 100%);
            padding: 15px 50px;
            border-radius: 50px;
            box-shadow: 0 6px 0 #CC8400, 0 10px 30px rgba(255, 165, 0, 0.3);
            margin-bottom: 30px;
        }

        .result-image {
            width: 300px;
            max-width: 90%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .result-image.shake {
            animation: imageShake 0.1s ease-in-out infinite;
        }

        @keyframes imageShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-3px, -2px) rotate(-1deg); }
            50% { transform: translate(3px, 2px) rotate(1deg); }
            75% { transform: translate(-2px, 3px) rotate(-0.5deg); }
        }

        /* 演出テキスト */
        .mystery-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 800;
            color: var(--pink-dark);
            text-shadow: 2px 2px 0 var(--white), 4px 4px 0 rgba(255, 107, 138, 0.3);
            z-index: 500;
            opacity: 0;
            display: none;
        }

        .mystery-text.show {
            display: block;
            animation: mysteryFadeIn 1s ease-out forwards;
        }

        .mystery-text.hide {
            animation: mysteryFadeOut 0.5s ease-out forwards;
        }

        @keyframes mysteryFadeIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes mysteryFadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
        }

        /* 画面割れ演出 */
        .crack-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 450;
            pointer-events: none;
            display: none;
        }

        .crack-overlay.active {
            display: block;
            animation: crackScreen 0.5s ease-out forwards;
        }

        .crack-piece {
            position: absolute;
            background: linear-gradient(180deg, #FFE4EC 0%, #FFF5E6 50%, #E8F5E9 100%);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        @keyframes crackScreen {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .crack-piece:nth-child(1) { top: 0; left: 0; width: 35%; height: 40%; animation: crackFly1 0.8s ease-out forwards; }
        .crack-piece:nth-child(2) { top: 0; right: 0; width: 65%; height: 35%; animation: crackFly2 0.8s ease-out forwards; }
        .crack-piece:nth-child(3) { top: 35%; left: 0; width: 45%; height: 35%; animation: crackFly3 0.8s ease-out forwards; }
        .crack-piece:nth-child(4) { top: 40%; right: 0; width: 55%; height: 30%; animation: crackFly4 0.8s ease-out forwards; }
        .crack-piece:nth-child(5) { bottom: 0; left: 0; width: 50%; height: 30%; animation: crackFly5 0.8s ease-out forwards; }
        .crack-piece:nth-child(6) { bottom: 0; right: 0; width: 50%; height: 35%; animation: crackFly6 0.8s ease-out forwards; }

        @keyframes crackFly1 { to { transform: translate(-100%, -100%) rotate(-20deg); opacity: 0; } }
        @keyframes crackFly2 { to { transform: translate(100%, -100%) rotate(25deg); opacity: 0; } }
        @keyframes crackFly3 { to { transform: translate(-150%, 50%) rotate(-30deg); opacity: 0; } }
        @keyframes crackFly4 { to { transform: translate(150%, 30%) rotate(20deg); opacity: 0; } }
        @keyframes crackFly5 { to { transform: translate(-80%, 150%) rotate(-15deg); opacity: 0; } }
        @keyframes crackFly6 { to { transform: translate(80%, 150%) rotate(15deg); opacity: 0; } }

        /* 虹色ガチャ画面 */
        .rainbow-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                #ff6b6b 0%, #feca57 14%, #48dbfb 28%, 
                #ff9ff3 42%, #54a0ff 57%, #5f27cd 71%, 
                #ff6b6b 85%, #feca57 100%);
            background-size: 400% 400%;
            animation: rainbowBg 3s ease infinite;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 500;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .rainbow-screen.active {
            display: flex;
        }

        @keyframes rainbowBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 豪華ガチャマシン */
        .luxury-gacha {
            position: relative;
            transform: scale(0);
            opacity: 0;
        }

        .luxury-gacha.show {
            animation: luxuryAppear 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes luxuryAppear {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .luxury-gacha-inner {
            position: relative;
            width: 250px;
            height: 350px;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 60px rgba(255, 255, 255, 0.5));
        }

        .luxury-top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 55px;
            background: linear-gradient(180deg, #FFD700 0%, #FFA500 50%, #FF8C00 100%);
            border-radius: 100px 100px 0 0;
            border: 4px solid #DAA520;
            border-bottom: none;
            box-shadow: inset 0 10px 20px rgba(255, 255, 255, 0.5);
        }

        .luxury-top::before {
            content: '👑';
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            animation: crownFloat 1s ease-in-out infinite alternate;
        }

        @keyframes crownFloat {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-5px); }
        }

        .luxury-globe {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 160px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.6) 100%);
            border-radius: 50%;
            border: 6px solid #FFD700;
            overflow: hidden;
            box-shadow: inset 0 -20px 40px rgba(255, 215, 0, 0.3), 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .luxury-balls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            padding: 10px;
            gap: 5px;
        }

        .luxury-ball {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            animation: luxuryWiggle 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .luxury-ball:nth-child(1) { background: linear-gradient(135deg, #FFD700 50%, #FFA500 50%); animation-delay: 0s; }
        .luxury-ball:nth-child(2) { background: linear-gradient(135deg, #FF69B4 50%, #FF1493 50%); animation-delay: 0.1s; }
        .luxury-ball:nth-child(3) { background: linear-gradient(135deg, #00CED1 50%, #008B8B 50%); animation-delay: 0.2s; }
        .luxury-ball:nth-child(4) { background: linear-gradient(135deg, #9370DB 50%, #8A2BE2 50%); animation-delay: 0.15s; }
        .luxury-ball:nth-child(5) { background: linear-gradient(135deg, #FFD700 50%, #FFA500 50%); animation-delay: 0.25s; }
        .luxury-ball:nth-child(6) { background: linear-gradient(135deg, #FF69B4 50%, #FF1493 50%); animation-delay: 0.05s; }

        @keyframes luxuryWiggle {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-4px) rotate(-8deg); }
            75% { transform: translateX(4px) rotate(8deg); }
        }

        .luxury-body {
            position: absolute;
            top: 205px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 110px;
            background: linear-gradient(180deg, #FFD700 0%, #FFA500 50%, #FF8C00 100%);
            border-radius: 0 0 30px 30px;
            border: 4px solid #DAA520;
            border-top: none;
            box-shadow: inset 0 -10px 20px rgba(0, 0, 0, 0.1);
        }

        .luxury-handle {
            position: absolute;
            right: -35px;
            top: 25px;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
            border-radius: 50%;
            border: 4px solid #C71585;
            box-shadow: 3px 3px 15px rgba(255, 20, 147, 0.5), 0 0 20px rgba(255, 105, 180, 0.5);
        }

        .luxury-handle::after {
            content: '💎';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.3rem;
        }

        .luxury-dispenser {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 45px;
            background: linear-gradient(180deg, #2C2C2C 0%, #1a1a1a 100%);
            border-radius: 0 0 20px 20px;
            box-shadow: inset 0 5px 10px rgba(255, 215, 0, 0.3);
        }

        .luxury-feet {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 18px;
            background: linear-gradient(180deg, #FFD700 0%, #DAA520 100%);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.5);
        }

        .luxury-sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .luxury-sparkle {
            position: absolute;
            font-size: 1.5rem;
            animation: luxurySparkle 2s ease-in-out infinite;
        }

        @keyframes luxurySparkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .hint-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
        }

        .hint-text.show {
            animation: hintAppear 0.5s ease-out forwards;
        }

        @keyframes hintAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        .retry-button {
            padding: 20px 40px;
            font-size: 1.4rem;
            font-weight: 800;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            color: white;
            background: linear-gradient(180deg, #FF69B4 0%, #FF1493 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #C71585, 0 8px 30px rgba(255, 20, 147, 0.5);
            transition: all 0.2s;
            margin-top: 15px;
            opacity: 0;
            transform: translateY(30px);
        }

        .retry-button.show {
            animation: buttonAppear 0.5s ease-out forwards;
        }

        @keyframes buttonAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #C71585, 0 12px 35px rgba(255, 20, 147, 0.6);
        }

        .retry-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #C71585, 0 4px 15px rgba(255, 20, 147, 0.4);
        }

        .retry-button::before {
            content: '🎰';
            margin-right: 10px;
        }

        .retry-button::after {
            content: '✨';
            margin-left: 10px;
        }

        /* デコレーション */
        .decoration {
            position: fixed;
            font-size: 2rem;
            z-index: 5;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .deco-1 { top: 10%; left: 5%; animation-delay: 0s; }
        .deco-2 { top: 15%; right: 5%; animation-delay: 0.5s; }
        .deco-3 { bottom: 20%; left: 8%; animation-delay: 1s; }
        .deco-4 { bottom: 25%; right: 8%; animation-delay: 1.5s; }

        /* みかちゃん紹介セクション */
        .intro-section {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 10px;
            margin: 10px 0 20px 0;
            position: relative;
        }

        .intro-image {
            width: 120px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(255, 107, 138, 0.3);
            border: 3px solid var(--pink-main);
        }

        .speech-bubble {
            position: relative;
            background: linear-gradient(180deg, #FFFFFF 0%, #FFF5F8 100%);
            border: 3px solid var(--pink-main);
            border-radius: 20px;
            padding: 15px 18px;
            max-width: 200px;
            box-shadow: 0 5px 15px rgba(255, 107, 138, 0.2);
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 30px;
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 15px solid var(--pink-main);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 33px;
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-right: 12px solid #FFFFFF;
        }

        .speech-bubble p {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--pink-dark);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- 雪のアニメーション -->
    <div class="snowflakes" id="snowflakes"></div>

    <!-- デコレーション -->
    <div class="decoration deco-1">🎄</div>
    <div class="decoration deco-2">⭐</div>
    <div class="decoration deco-3">🎁</div>
    <div class="decoration deco-4">🔔</div>

    <!-- メイン画面 -->
    <div class="container" id="mainScreen">
        <h1 class="title">
            <span style="animation-delay: 0s;">み</span>
            <span style="animation-delay: 0.1s;">か</span>
            <span style="animation-delay: 0.2s;">ち</span>
            <span style="animation-delay: 0.3s;">ゃ</span>
            <span style="animation-delay: 0.4s;">ん</span>
            <span style="animation-delay: 0.5s;">の</span>
            <span style="animation-delay: 0.6s;">🎄</span>
            <br>
            <span style="animation-delay: 0.7s;">ク</span>
            <span style="animation-delay: 0.8s;">リ</span>
            <span style="animation-delay: 0.9s;">ス</span>
            <span style="animation-delay: 1s;">マ</span>
            <span style="animation-delay: 1.1s;">ス</span>
            <span style="animation-delay: 1.2s;">ガ</span>
            <span style="animation-delay: 1.3s;">チ</span>
            <span style="animation-delay: 1.4s;">ャ</span>
            <span style="animation-delay: 1.5s;">🎅</span>
        </h1>

        <div class="intro-section">
            <img src="IMG_0001.PNG" alt="みかちゃん" class="intro-image">
            <div class="speech-bubble">
                <p>何等が出るかな〜？🌟最後にガチャ結果が表示されるよ♡</p>
            </div>
        </div>

        <div class="gacha-machine">
            <div class="gacha-top"></div>
            <div class="gacha-globe">
                <div class="gacha-balls">
                    <div class="mini-ball"></div>
                    <div class="mini-ball"></div>
                    <div class="mini-ball"></div>
                    <div class="mini-ball"></div>
                    <div class="mini-ball"></div>
                    <div class="mini-ball"></div>
                    <div class="mini-ball"></div>
                    <div class="mini-ball"></div>
                </div>
            </div>
            <div class="gacha-body">
                <div class="gacha-handle"></div>
                <div class="gacha-dispenser"></div>
            </div>
            <div class="gacha-feet"></div>
        </div>

        <button class="spin-button" onclick="showConfirmModal()">1回回す</button>
    </div>

    <!-- 確認モーダル -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-text">本当に回す？🐣💛</div>
            <div class="modal-warning">※1回限りです！</div>
            <div class="modal-buttons">
                <button class="modal-btn yes" onclick="startGacha()">回す</button>
                <button class="modal-btn no" onclick="hideConfirmModal()">回さない</button>
            </div>
        </div>
    </div>

    <!-- カプセル演出画面 -->
    <div class="capsule-screen" id="capsuleScreen">
        <div class="capsule" id="capsule">
            <div class="capsule-top" id="capsuleTop">
                <div class="capsule-shine"></div>
            </div>
            <div class="capsule-bottom"></div>
        </div>
    </div>

    <!-- 光り輝く画像演出画面 -->
    <div class="reveal-screen" id="revealScreen">
        <div class="light-burst">
            <div class="light-ray" style="transform: translate(-50%, -50%) rotate(0deg);"></div>
            <div class="light-ray" style="transform: translate(-50%, -50%) rotate(30deg);"></div>
            <div class="light-ray" style="transform: translate(-50%, -50%) rotate(60deg);"></div>
            <div class="light-ray" style="transform: translate(-50%, -50%) rotate(90deg);"></div>
            <div class="light-ray" style="transform: translate(-50%, -50%) rotate(120deg);"></div>
            <div class="light-ray" style="transform: translate(-50%, -50%) rotate(150deg);"></div>
        </div>
        <div class="sparkles" id="sparkles"></div>
        <div class="rank-text" id="rankText">3等💛</div>
        <div class="prize-name" id="prizeName">みかの非公開の私服写真🥰</div>
        <img src="IMG_9991.jpg" alt="ガチャ結果" class="reveal-image" id="revealImage">
    </div>

    <!-- 結果画面 -->
    <div class="result-screen" id="resultScreen">
        <h2 class="result-title">ガチャ結果🐣</h2>
        <div class="result-rank">3等💛</div>
        <img src="IMG_9991.jpg" alt="ガチャ結果" class="result-image">
    </div>

    <!-- 演出テキスト -->
    <div class="mystery-text" id="mysteryText1">おや…🤔</div>
    <div class="mystery-text" id="mysteryText2">ガチャの様子が…✨</div>

    <!-- 画面割れ演出 -->
    <div class="crack-overlay" id="crackOverlay">
        <div class="crack-piece"></div>
        <div class="crack-piece"></div>
        <div class="crack-piece"></div>
        <div class="crack-piece"></div>
        <div class="crack-piece"></div>
        <div class="crack-piece"></div>
    </div>

    <!-- 虹色ガチャ画面 -->
    <div class="rainbow-screen" id="rainbowScreen">
        <div class="luxury-gacha" id="luxuryGacha">
            <div class="luxury-gacha-inner">
                <div class="luxury-sparkles">
                    <span class="luxury-sparkle" style="top: 5%; left: 10%; animation-delay: 0s;">✨</span>
                    <span class="luxury-sparkle" style="top: 10%; right: 15%; animation-delay: 0.3s;">⭐</span>
                    <span class="luxury-sparkle" style="top: 40%; left: 5%; animation-delay: 0.6s;">💫</span>
                    <span class="luxury-sparkle" style="top: 50%; right: 5%; animation-delay: 0.9s;">🌟</span>
                    <span class="luxury-sparkle" style="bottom: 20%; left: 15%; animation-delay: 0.4s;">✨</span>
                    <span class="luxury-sparkle" style="bottom: 15%; right: 10%; animation-delay: 0.7s;">⭐</span>
                </div>
                <div class="luxury-top"></div>
                <div class="luxury-globe">
                    <div class="luxury-balls">
                        <div class="luxury-ball"></div>
                        <div class="luxury-ball"></div>
                        <div class="luxury-ball"></div>
                        <div class="luxury-ball"></div>
                        <div class="luxury-ball"></div>
                        <div class="luxury-ball"></div>
                    </div>
                </div>
                <div class="luxury-body">
                    <div class="luxury-handle"></div>
                    <div class="luxury-dispenser"></div>
                </div>
                <div class="luxury-feet"></div>
            </div>
        </div>
        <div class="hint-text" id="hintText">↓押したら良いことがあるかも🫢</div>
        <button class="retry-button" id="retryButton" onclick="resetGacha()">もう一回チャンスがあります…！</button>
    </div>

    <script>
        // 雪を生成
        function createSnowflakes() {
            const container = document.getElementById('snowflakes');
            const snowflakeChars = ['❄', '❅', '❆', '✧', '✦'];
            
            for (let i = 0; i < 50; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 4) + 's';
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                snowflake.style.fontSize = (Math.random() * 1 + 0.8) + 'rem';
                container.appendChild(snowflake);
            }
        }

        // キラキラを生成
        function createSparkles() {
            const container = document.getElementById('sparkles');
            container.innerHTML = '';
            const sparkleChars = ['✨', '⭐', '💫', '🌟', '✧'];
            
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(sparkle);
            }
        }

        // 確認モーダル表示
        function showConfirmModal() {
            document.getElementById('confirmModal').classList.add('active');
        }

        // 確認モーダル非表示
        function hideConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }

        // ガチャ開始
        function startGacha() {
            hideConfirmModal();
            
            // カプセル画面を表示
            const capsuleScreen = document.getElementById('capsuleScreen');
            const capsule = document.getElementById('capsule');
            const capsuleTop = document.getElementById('capsuleTop');
            
            capsuleScreen.classList.add('active');
            
            // カプセルをリセット
            capsule.className = 'capsule';
            capsuleTop.className = 'capsule-top';
            
            // カプセルがゆっくり落ちてくる
            setTimeout(() => {
                capsule.classList.add('drop');
            }, 300);
            
            // カプセルがグラグラ揺れる
            setTimeout(() => {
                capsule.classList.remove('drop');
                capsule.classList.add('shake');
            }, 2200);
            
            // カプセルが光り輝く
            setTimeout(() => {
                capsule.classList.remove('shake');
                capsule.classList.add('glow');
            }, 4200);
            
            // カプセルが開く
            setTimeout(() => {
                capsuleTop.classList.add('open');
            }, 4800);
            
            // 光り輝く画像演出へ
            setTimeout(() => {
                capsuleScreen.classList.remove('active');
                showReveal();
            }, 5800);
        }

        // 光り輝く画像演出
        function showReveal() {
            createSparkles();
            const revealScreen = document.getElementById('revealScreen');
            const revealImage = document.getElementById('revealImage');
            const rankText = document.getElementById('rankText');
            
            revealScreen.classList.add('active');
            
            // アニメーションをリセット
            revealImage.style.animation = 'none';
            rankText.style.animation = 'none';
            rankText.style.opacity = '0';
            
            setTimeout(() => {
                revealImage.style.animation = 'imageReveal 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards';
            }, 100);
            
            // 3等の文字を表示
            setTimeout(() => {
                rankText.style.animation = 'rankPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards';
                rankText.style.opacity = '1';
            }, 1200);
            
            // 少し待ってから結果画面へ
            setTimeout(() => {
                revealScreen.classList.remove('active');
                showResult();
            }, 4500);
        }

        // 結果画面表示
        function showResult() {
            const resultScreen = document.getElementById('resultScreen');
            const resultImage = resultScreen.querySelector('.result-image');
            
            resultScreen.classList.add('active');
            
            // すぐに画像がピクピク動き始める
            setTimeout(() => {
                resultImage.classList.add('shake');
            }, 100);
            
            // すぐに「おや…」を表示
            setTimeout(() => {
                startMysterySequence();
            }, 300);
        }

        // 謎の演出シーケンス
        function startMysterySequence() {
            const mysteryText1 = document.getElementById('mysteryText1');
            const mysteryText2 = document.getElementById('mysteryText2');
            const crackOverlay = document.getElementById('crackOverlay');
            const resultScreen = document.getElementById('resultScreen');
            const resultImage = resultScreen.querySelector('.result-image');
            const rainbowScreen = document.getElementById('rainbowScreen');
            const luxuryGacha = document.getElementById('luxuryGacha');
            const retryButton = document.getElementById('retryButton');
            
            // 「おや…」を表示
            mysteryText1.classList.add('show');
            
            // 「おや…」を消す
            setTimeout(() => {
                mysteryText1.classList.add('hide');
            }, 1200);
            
            // 「ガチャの様子が…」を表示
            setTimeout(() => {
                mysteryText1.classList.remove('show', 'hide');
                mysteryText2.classList.add('show');
            }, 1800);
            
            // 「ガチャの様子が…」を消す
            setTimeout(() => {
                mysteryText2.classList.add('hide');
            }, 3000);
            
            // 画面割れ演出
            setTimeout(() => {
                mysteryText2.classList.remove('show', 'hide');
                resultImage.classList.remove('shake');
                crackOverlay.classList.add('active');
            }, 3400);
            
            // 虹色画面を表示
            setTimeout(() => {
                resultScreen.classList.remove('active');
                crackOverlay.classList.remove('active');
                rainbowScreen.classList.add('active');
            }, 3700);
            
            // 豪華ガチャを表示
            setTimeout(() => {
                luxuryGacha.classList.add('show');
            }, 4000);
            
            // ヒントテキストを表示
            setTimeout(() => {
                document.getElementById('hintText').classList.add('show');
            }, 4800);
            
            // ボタンを表示
            setTimeout(() => {
                retryButton.classList.add('show');
            }, 5200);
        }

        // ガチャリセット
        function resetGacha() {
            document.getElementById('rainbowScreen').classList.remove('active');
            document.getElementById('luxuryGacha').classList.remove('show');
            document.getElementById('retryButton').classList.remove('show');
            document.getElementById('hintText').classList.remove('show');
        }

        // 初期化
        createSnowflakes();
    </script>
</body>
</html>
