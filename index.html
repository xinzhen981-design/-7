<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>みかちゃんのクリスマスパック</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #0a1628 0%, #1a2f4a 50%, #2d1810 100%);
            font-family: 'Kaisei Decol', serif;
            overflow-x: hidden;
            position: relative;
        }

        /* 雪のアニメーション */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #fff;
            font-size: 1rem;
            animation: fall linear infinite;
            opacity: 0.8;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        /* 星のきらめき */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* コンテナ */
        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* タイトル */
        .title-container {
            text-align: center;
            margin-bottom: 50px;
            animation: titleFloat 3s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-family: 'Fredoka', 'Kaisei Decol', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700 0%, #ff6b6b 25%, #ffd700 50%, #ff6b6b 75%, #ffd700 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            letter-spacing: 0.1em;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .subtitle {
            font-size: 1.2rem;
            color: #90ee90;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(144, 238, 144, 0.5);
        }

        /* デコレーション */
        .decoration {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 2rem;
        }

        .decoration span {
            animation: bounce 1s ease-in-out infinite;
        }

        .decoration span:nth-child(2) { animation-delay: 0.1s; }
        .decoration span:nth-child(3) { animation-delay: 0.2s; }
        .decoration span:nth-child(4) { animation-delay: 0.3s; }
        .decoration span:nth-child(5) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* パックグリッド */
        .packs-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }

        .pack-row {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* パックカード */
        .pack {
            width: 140px;
            height: 200px;
            background: linear-gradient(145deg, #c41e3a 0%, #8b0000 50%, #c41e3a 100%);
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5),
                inset 0 2px 10px rgba(255, 255, 255, 0.2),
                0 0 20px rgba(255, 215, 0, 0.3);
            border: 3px solid #ffd700;
            overflow: hidden;
        }

        .pack::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .pack:hover::before {
            left: 100%;
        }

        .pack:hover {
            transform: translateY(-15px) scale(1.05) rotateY(5deg);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 2px 15px rgba(255, 255, 255, 0.3),
                0 0 40px rgba(255, 215, 0, 0.6);
        }

        .pack:active {
            transform: translateY(-5px) scale(0.98);
        }

        /* パックの装飾 */
        .pack-inner {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .pack-ribbon {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 100%;
            background: linear-gradient(90deg, #228b22 0%, #32cd32 50%, #228b22 100%);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .pack-ribbon-h {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 30px;
            background: linear-gradient(180deg, #228b22 0%, #32cd32 50%, #228b22 100%);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .pack-bow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            z-index: 2;
        }

        .bow-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25px;
            height: 25px;
            background: radial-gradient(circle, #ffd700 0%, #daa520 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            z-index: 3;
        }

        .bow-loop {
            position: absolute;
            width: 30px;
            height: 20px;
            background: linear-gradient(135deg, #ffd700 0%, #daa520 100%);
            border-radius: 50%;
        }

        .bow-loop-left {
            top: 50%;
            left: 0;
            transform: translateY(-50%) rotate(-30deg);
        }

        .bow-loop-right {
            top: 50%;
            right: 0;
            transform: translateY(-50%) rotate(30deg);
        }

        /* パック番号 */
        .pack-number {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        /* クリスマスツリーの装飾（背景） */
        .tree-left, .tree-right {
            position: fixed;
            bottom: 0;
            width: 150px;
            height: 300px;
            z-index: 1;
            pointer-events: none;
        }

        .tree-left {
            left: 20px;
        }

        .tree-right {
            right: 20px;
        }

        .tree-shape {
            width: 0;
            height: 0;
            border-left: 75px solid transparent;
            border-right: 75px solid transparent;
            border-bottom: 120px solid #0d5c0d;
            position: absolute;
            filter: drop-shadow(0 0 10px rgba(0, 100, 0, 0.5));
        }

        .tree-shape:nth-child(1) {
            bottom: 160px;
        }

        .tree-shape:nth-child(2) {
            bottom: 100px;
            border-left-width: 85px;
            border-right-width: 85px;
            border-bottom-width: 130px;
            left: -10px;
        }

        .tree-shape:nth-child(3) {
            bottom: 30px;
            border-left-width: 95px;
            border-right-width: 95px;
            border-bottom-width: 140px;
            left: -20px;
        }

        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 50px;
            background: linear-gradient(90deg, #4a3728, #6b4423, #4a3728);
            border-radius: 0 0 5px 5px;
        }

        .tree-star {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            animation: starGlow 1.5s ease-in-out infinite;
        }

        @keyframes starGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 10px #ffd700);
                transform: translateX(-50%) scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 20px #ffd700);
                transform: translateX(-50%) scale(1.2);
            }
        }

        /* オーナメント */
        .ornament {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: ornamentGlow 2s ease-in-out infinite;
        }

        @keyframes ornamentGlow {
            0%, 100% { box-shadow: 0 0 5px currentColor; }
            50% { box-shadow: 0 0 15px currentColor; }
        }

        /* フッター */
        .footer {
            margin-top: 50px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .footer p {
            margin: 5px 0;
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
            }

            .pack {
                width: 110px;
                height: 160px;
            }

            .pack-number {
                font-size: 1.4rem;
            }

            .tree-left, .tree-right {
                display: none;
            }
        }

        /* パーティクルエフェクト */
        .sparkle {
            position: fixed;
            pointer-events: none;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #ffd700, transparent);
            border-radius: 50%;
            animation: sparkleAnim 1s ease-out forwards;
            z-index: 100;
        }

        @keyframes sparkleAnim {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* みかちゃんセクション */
        .mika-section {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mika-image {
            width: 250px;
            height: auto;
            border-radius: 20px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(255, 182, 193, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .mika-image:hover {
            transform: scale(1.03);
        }

        /* 吹き出し */
        .speech-bubble {
            position: relative;
            background: linear-gradient(135deg, #fff 0%, #ffe4e9 100%);
            border-radius: 25px;
            padding: 20px 30px;
            max-width: 280px;
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(255, 105, 180, 0.3);
            animation: bubbleBounce 2s ease-in-out infinite;
            margin-top: 30px;
        }

        @keyframes bubbleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 30px;
            border-width: 15px;
            border-style: solid;
            border-color: transparent #fff transparent transparent;
            filter: drop-shadow(-3px 2px 3px rgba(0, 0, 0, 0.1));
        }

        .speech-bubble p {
            font-family: 'Kaisei Decol', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #c41e3a;
            text-align: center;
            margin: 0;
            line-height: 1.6;
        }

        .speech-bubble .heart {
            color: #ff69b4;
            animation: heartBeat 1s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            .mika-section {
                flex-direction: column;
                align-items: center;
            }

            .mika-image {
                width: 200px;
            }

            .speech-bubble {
                margin-top: 10px;
            }

            .speech-bubble::before {
                left: 50%;
                top: -25px;
                transform: translateX(-50%) rotate(90deg);
            }

            .speech-bubble p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

    <script>
        // 星を生成
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                starsContainer.appendChild(star);
            }
        }

        // 雪を生成
        function createSnowflakes() {
            const snowflakesContainer = document.getElementById('snowflakes');
            const snowflakeChars = ['❄', '❅', '❆', '✻', '✼', '❉'];
            
            for (let i = 0; i < 50; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = snowflakeChars[Math.floor(Math.random() * snowflakeChars.length)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                snowflake.style.animationDelay = Math.random() * 10 + 's';
                snowflake.style.fontSize = (Math.random() * 1 + 0.5) + 'rem';
                snowflakesContainer.appendChild(snowflake);
            }
        }

        // パックのリンク
        const packLinks = {
            1: 'https://note.com/noble_elk7293/n/ned8f260c8fa9',
            2: 'https://note.com/noble_elk7293/n/n8ba1d2f2a556',
            3: 'https://note.com/noble_elk7293/n/n7d471660a78c',
            4: 'https://note.com/noble_elk7293/n/n7c6e6bde6044',

        // パック選択時のエフェクト
        function selectPack(number) {
            // キラキラエフェクト
            const event = window.event;

                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.left = (event.clientX + (Math.random() - 0.5) * 100) + 'px';
                    sparkle.style.top = (event.clientY + (Math.random() - 0.5) * 100) + 'px';
                    document.body.appendChild(sparkle);
                    
                    setTimeout(() => sparkle.remove(), 1000);
                }, i * 50);
            }

            // 確認ダイアログ
            setTimeout(() => {
                const confirmed = confirm(`🎁 パック${number}を開きますか？\n\n本当に開きますか？`);
                if (confirmed) {
                    window.open(packLinks[number], '_blank');
                }
            }, 300);
        }

        // 初期化
        createStars();
        createSnowflakes();
    </script>
</body>
</html>
